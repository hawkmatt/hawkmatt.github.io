<!DOCTYPE html>
<html>
<body>

<input id="token" placeholder="Enter access code">

<button onclick="go()">
Access File
</button>

<script>
function go() {
    const token =
        document.getElementById("token").value;

    window.location =
      "https://my-worker.username.workers.dev/file/"
      + token;
}
</script>

</body>
</html>
